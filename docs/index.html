<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1f4e78">
  <title>電子部品 在庫管理</title>
  <style>
    :root { --blue:#1f4e78; --bg:#f4f7fb; --red:#c62828; --green:#16794c; --line:#dbe4ee; --ink:#1f2937; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif; color:var(--ink); background:var(--bg); }
    header { padding:16px 20px; color:#fff; background:var(--blue); }
    header .header-inner { max-width:1240px; margin:0 auto; display:flex; align-items:center; justify-content:space-between; gap:12px; }
    h1 { margin:0; font-size:21px; }
    main { max-width:1240px; margin:0 auto; padding:18px; }
    .screen { max-width:520px; margin:8vh auto 0; padding:28px 22px; text-align:center; background:#fff; border-radius:16px; box-shadow:0 2px 12px #183b5514; }
    .screen h2 { color:var(--blue); }
    .screen p { line-height:1.8; color:#64748b; }
    .hidden { display:none !important; }
    .cards { display:grid; grid-template-columns:repeat(2,minmax(0,220px)); gap:12px; margin-bottom:16px; }
    .card, section { background:#fff; border-radius:12px; padding:16px; box-shadow:0 2px 8px #183b5514; }
    .card small { color:#64748b; display:block; }
    .card strong { display:block; font-size:28px; margin-top:4px; }
    .danger { color:var(--red); }
    .page-toolbar { display:flex; align-items:center; justify-content:space-between; gap:16px; margin-bottom:16px; }
    .page-toolbar h2 { margin-bottom:4px; }
    .page-toolbar p { margin:0; }
    h2 { font-size:17px; margin:0 0 14px; }
    label { display:block; font-size:13px; color:#475569; margin:10px 0 4px; }
    input, select, textarea, button { width:100%; padding:9px 10px; border:1px solid #cbd5e1; border-radius:7px; font:inherit; }
    textarea { min-height:60px; resize:vertical; }
    button { cursor:pointer; border:0; color:#fff; background:var(--blue); font-weight:600; margin-top:12px; }
    button.secondary { color:#334155; background:#e2e8f0; }
    button.link { width:auto; margin:0; padding:7px 10px; font-size:12px; background:#e2e8f0; color:#334155; }
    button.small { width:auto; margin:0; padding:6px 8px; font-size:12px; }
    button.add { background:#16794c; }
    button.use { background:#b45309; }
    button.observe { background:#6d28d9; }
    button.history { color:#334155; background:#e2e8f0; }
    button.delete { color:#991b1b; background:#fee2e2; }
    .page-toolbar button { width:auto; margin:0; padding:10px 16px; white-space:nowrap; }
    .row { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
    .toolbar { display:grid; grid-template-columns:minmax(0,1fr) auto auto; gap:8px; margin-bottom:12px; }
    .toolbar button { width:auto; margin:0; padding:8px 12px; white-space:nowrap; }
    .filter-grid { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)) auto; gap:8px; align-items:end; margin-bottom:14px; }
    .filter-grid label { margin:0; }
    .filter-grid select, .filter-grid button { margin:0; }
    .filter-grid button { width:auto; white-space:nowrap; }
    .table-wrap { overflow:auto; }
    table { width:100%; border-collapse:collapse; font-size:13px; min-width:720px; }
    th, td { padding:9px 8px; border-bottom:1px solid #e2e8f0; text-align:left; vertical-align:middle; }
    th { color:#475569; background:#f8fafc; }
    tr.low { background:#fff3f3; }
    .actions { display:flex; flex-wrap:wrap; gap:5px; min-width:260px; }
    .muted { color:#64748b; font-size:12px; }
    .field-hint { margin:4px 0 0; color:#64748b; font-size:11px; line-height:1.5; }
    .tag-combobox { position:relative; }
    .tag-input-row { display:flex; gap:6px; }
    .tag-input-row input { min-width:0; flex:1; }
    .tag-toggle { flex:0 0 38px; width:38px; margin:0; padding:0; color:#334155; background:#e2e8f0; font-size:17px; line-height:1; }
    .tag-options { position:absolute; z-index:20; top:calc(100% + 4px); left:0; right:0; max-height:190px; overflow:auto; padding:4px; border:1px solid #cbd5e1; border-radius:8px; background:#fff; box-shadow:0 8px 22px #0f172a26; }
    .tag-options button { width:100%; margin:0; padding:8px 9px; border-radius:5px; color:#334155; background:#fff; text-align:left; font-size:13px; font-weight:500; }
    .tag-options button:hover, .tag-options button:focus { background:#eff6ff; }
    .tag-empty { padding:8px 9px; color:#64748b; font-size:12px; line-height:1.5; }
    .genre-details { margin-top:16px; padding-top:14px; border-top:1px solid var(--line); }
    .genre-details h3 { margin:0 0 8px; font-size:14px; }
    .spec-grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
    .spec-grid label { margin-top:8px; }
    .custom-specs { margin-top:14px; }
    .custom-specs h4 { margin:0 0 8px; font-size:13px; }
    .custom-spec-row { display:grid; grid-template-columns:minmax(90px,0.8fr) minmax(0,1.2fr) auto; gap:6px; margin-top:6px; }
    .custom-spec-row button { width:auto; margin:0; padding:7px 9px; }
    .add-custom-spec { width:auto; margin-top:8px; padding:7px 10px; color:#334155; background:#e2e8f0; font-size:12px; }
    .spec-summary { color:#475569; white-space:normal; line-height:1.5; }
    .user { display:flex; align-items:center; gap:8px; font-size:12px; }
    .user-name { max-width:250px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    #message { min-height:22px; margin:8px 0; font-size:13px; }
    #message.error { color:var(--red); }
    #message.ok { color:var(--green); }
    dialog { width:min(94vw,520px); max-height:90vh; padding:0; border:0; border-radius:14px; box-shadow:0 10px 40px #0f172a40; }
    dialog::backdrop { background:#0f172a66; }
    .dialog-body { padding:20px; }
    .dialog-header { display:flex; align-items:flex-start; justify-content:space-between; gap:12px; }
    .dialog-header h2 { margin-bottom:4px; }
    .dialog-close { flex:0 0 auto; width:36px; height:36px; margin:0; padding:0; color:#475569; background:#f1f5f9; font-size:22px; line-height:1; }
    .part-form { margin-top:14px; }
    .form-actions { display:grid; gap:8px; margin-top:16px; }
    .form-actions button { margin:0; }
    .dialog-actions { display:flex; gap:8px; margin-top:16px; }
    .dialog-actions button { margin:0; }
    .history-list { max-height:60vh; overflow:auto; }
    .history-item { padding:11px 0; border-bottom:1px solid var(--line); }
    .history-top { display:flex; justify-content:space-between; gap:8px; font-weight:700; }
    .history-meta { margin-top:4px; color:#64748b; font-size:12px; line-height:1.6; }
    .delta-positive { color:var(--green); }
    .delta-negative { color:var(--red); }
    code { padding:2px 4px; border-radius:4px; background:#f1f5f9; }
    @media (max-width:800px) {
      .cards { grid-template-columns:repeat(2,minmax(0,1fr)); }
      main { padding:12px; }
      header { padding:14px 12px; }
      header .header-inner { align-items:flex-start; }
      .user-name { max-width:145px; }
    }
    @media (max-width:640px) {
      .page-toolbar { align-items:stretch; flex-direction:column; gap:10px; }
      .page-toolbar button { width:100%; }
      .cards { grid-template-columns:1fr 1fr; gap:8px; }
      .card, section { padding:14px; }
      .card strong { font-size:24px; }
      .toolbar { grid-template-columns:1fr; }
      .toolbar button { width:100%; }
      .filter-grid { grid-template-columns:1fr 1fr; }
      .filter-grid button { width:100%; grid-column:1 / -1; }
      .table-wrap { overflow:visible; }
      table, tbody, tr, td { display:block; }
      table { min-width:0; }
      thead { display:none; }
      tbody { display:grid; gap:12px; }
      tr { padding:10px 12px; border:1px solid var(--line); border-radius:10px; box-shadow:0 2px 8px #183b5510; }
      tr.low { background:#fff3f3; }
      td { display:flex; justify-content:space-between; gap:12px; padding:7px 0; border-bottom:1px solid var(--line); white-space:normal; text-align:right; }
      td::before { content:attr(data-label); flex:0 0 72px; color:#64748b; font-size:12px; font-weight:600; text-align:left; }
      td:first-child { display:block; padding-top:2px; text-align:left; }
      td:first-child::before { display:none; }
      td:last-child { display:block; padding-bottom:2px; border-bottom:0; text-align:left; }
      td:last-child::before { display:block; margin-bottom:8px; }
      .actions { min-width:0; display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); }
      .actions button { width:100%; }
      dialog { width:calc(100vw - 24px); max-height:calc(100vh - 24px); border-radius:12px; }
      .dialog-body { padding:16px; }
      .row { grid-template-columns:1fr; gap:0; }
      .spec-grid { grid-template-columns:1fr; gap:0; }
      .custom-spec-row { grid-template-columns:1fr 1fr auto; }
    }
  </style>
</head>
<body>
  <header>
    <div class="header-inner">
      <h1>電子部品 在庫管理</h1>
      <div id="userBar" class="user hidden"><span id="userName" class="user-name"></span><button id="logoutButton" class="link" type="button">ログアウト</button></div>
    </div>
  </header>

  <main>
    <section id="statusScreen" class="screen">
      <h2 id="statusTitle">起動中...</h2>
      <p id="statusText">Firebaseを確認しています。</p>
      <button id="loginButton" class="hidden" type="button">Googleでログイン</button>
    </section>

    <div id="appScreen" class="hidden">
      <div id="message"></div>
      <div class="cards">
        <div class="card"><small>部品種類</small><strong id="partCount">-</strong></div>
        <div class="card"><small>低在庫</small><strong id="lowStockCount" class="danger">-</strong></div>
      </div>

      <div class="page-toolbar">
        <div><h2>部品一覧</h2><p class="muted">追加・使用・観測・編集は各部品の操作から行えます。</p></div>
        <button type="button" class="add" id="addPartButton">＋ 部品を追加</button>
      </div>
      <section>
        <div class="toolbar"><input id="search" placeholder="型番・ジャンル・メーカー・場所・メモで検索"><button type="button" class="secondary" id="reload">再読込</button><button type="button" class="secondary" id="hardReload">キャッシュを無視して再読込</button></div>
        <div class="filter-grid">
          <label for="filterCategory">ジャンル<select id="filterCategory"><option value="">すべて</option></select></label>
          <label for="filterManufacturer">メーカー<select id="filterManufacturer"><option value="">すべて</option></select></label>
          <label for="filterLocation">保管場所<select id="filterLocation"><option value="">すべて</option></select></label>
          <button type="button" class="secondary" id="clearFilters">絞り込みをクリア</button>
        </div>
        <div class="table-wrap"><table><thead><tr><th>部品名</th><th>ジャンル</th><th>保管場所</th><th>推定在庫</th><th>仕様</th><th>操作</th></tr></thead><tbody id="partsBody"></tbody></table></div>
        <p class="muted">追加・使用は推定在庫を動かします。観測は実際に数えた個数へ合わせ、ズレを履歴に残します。</p>
      </div>
    </div>
  </main>

  <dialog id="partDialog">
    <div class="dialog-body">
      <div class="dialog-header">
        <div><h2 id="partFormTitle">部品を追加</h2><p id="partFormHint" class="muted">新しい部品は在庫0で登録されます。</p></div>
        <button type="button" class="dialog-close" id="partDialogClose" aria-label="閉じる">×</button>
      </div>
      <form id="partForm" class="part-form">
        <label for="name">型番・部品名 *</label><input id="name" required placeholder="例: RC0603FR-0710KL">
        <div class="row">
          <div>
            <label for="category">ジャンル</label>
            <div class="tag-combobox" data-tag-field="category">
              <div class="tag-input-row"><input id="category" placeholder="例: チップ抵抗" autocomplete="off"><button type="button" class="tag-toggle" data-tag-toggle="category" aria-label="ジャンル候補を表示">⌄</button></div>
              <div id="categoryTags" class="tag-options hidden"></div>
            </div>
          </div>
          <div>
            <label for="manufacturer">メーカー</label>
            <div class="tag-combobox" data-tag-field="manufacturer">
              <div class="tag-input-row"><input id="manufacturer" placeholder="候補から選択または入力" autocomplete="off"><button type="button" class="tag-toggle" data-tag-toggle="manufacturer" aria-label="メーカー候補を表示">⌄</button></div>
              <div id="manufacturerTags" class="tag-options hidden"></div>
            </div>
          </div>
        </div>
        <div class="row">
          <div>
            <label for="location">保管場所</label>
            <div class="tag-combobox" data-tag-field="location">
              <div class="tag-input-row"><input id="location" placeholder="例: 棚A-01" autocomplete="off"><button type="button" class="tag-toggle" data-tag-toggle="location" aria-label="保管場所候補を表示">⌄</button></div>
              <div id="locationTags" class="tag-options hidden"></div>
            </div>
          </div>
          <div><label for="unit">単位</label><input id="unit" value="個"></div>
        </div>
        <p class="field-hint">ジャンル・メーカー・保管場所は、候補を選ぶか新しい値を入力できます。使われなくなった候補は自動的に消えます。</p>
        <div id="genreDetails" class="genre-details"></div>
        <label for="minStock">補充目安</label><input id="minStock" type="number" min="0" value="0">
        <label for="note">メモ</label><textarea id="note"></textarea>
        <div class="form-actions">
          <button type="submit" id="partSubmit">部品を追加</button>
          <button type="button" class="secondary" id="cancelEdit">キャンセル</button>
          <button type="button" class="delete hidden" id="deleteEditingPart">削除</button>
        </div>
      </form>
    </div>
  </dialog>

  <dialog id="operationDialog">
    <div class="dialog-body">
      <h2 id="operationTitle">在庫を変更</h2>
      <p id="operationPartName" class="muted"></p>
      <form id="operationForm">
        <label id="operationAmountLabel" for="operationAmount">数量</label>
        <input id="operationAmount" type="number" min="0" step="1" required>
        <p id="operationHint" class="muted"></p>
        <label for="operationNote">メモ</label>
        <textarea id="operationNote" placeholder="使用先、購入先、数え直した理由など"></textarea>
        <div class="dialog-actions"><button type="button" class="secondary" id="operationCancel">キャンセル</button><button type="submit">保存</button></div>
      </form>
    </div>
  </dialog>

  <dialog id="historyDialog">
    <div class="dialog-body">
      <h2 id="historyTitle">変更履歴</h2>
      <div id="historyList" class="history-list"></div>
      <div class="dialog-actions"><button type="button" class="secondary" id="historyClose">閉じる</button></div>
    </div>
  </dialog>

  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js';
    import { getAuth, GoogleAuthProvider, onAuthStateChanged, signInWithPopup, signOut } from 'https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js';
    import { addDoc, collection, doc, getDocs, getFirestore, query, runTransaction, serverTimestamp, setDoc, where, writeBatch } from 'https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js';
    import { firebaseConfig, isFirebaseConfigured } from './firebase-config.js';

    const $ = (id) => document.getElementById(id);
    const state = { app:null, auth:null, db:null, user:null, parts:[], editingId:'', operation:null };
    const TAG_FIELDS = [
      { key:'category', inputId:'category', menuId:'categoryTags' },
      { key:'manufacturer', inputId:'manufacturer', menuId:'manufacturerTags' },
      { key:'location', inputId:'location', menuId:'locationTags' }
    ];
    const FILTER_FIELDS = [
      { key:'category', selectId:'filterCategory' },
      { key:'manufacturer', selectId:'filterManufacturer' },
      { key:'location', selectId:'filterLocation' }
    ];
    const GENRE_SPEC_FIELDS = {
      '抵抗': [
        { key:'resistance', label:'抵抗値', placeholder:'例: 10kΩ' },
        { key:'tolerance', label:'許容差', placeholder:'例: ±1%' },
        { key:'power', label:'定格電力', placeholder:'例: 0.25W' }
      ],
      'チップ抵抗': [
        { key:'resistance', label:'抵抗値', placeholder:'例: 10kΩ' },
        { key:'size', label:'サイズ', placeholder:'例: 0603' },
        { key:'tolerance', label:'許容差', placeholder:'例: ±1%' },
        { key:'power', label:'定格電力', placeholder:'例: 0.1W' }
      ]
    };

    function showStatus(title, text, showLogin = false) {
      $('statusTitle').textContent = title;
      $('statusText').textContent = text;
      $('loginButton').classList.toggle('hidden', !showLogin);
      $('statusScreen').classList.remove('hidden');
      $('appScreen').classList.add('hidden');
    }

    function showMessage(message, error = false) {
      $('message').textContent = message || '';
      $('message').className = error ? 'error' : 'ok';
    }

    function toNumber(value, fallback = 0) {
      const number = Number(value);
      return Number.isFinite(number) ? number : fallback;
    }

    function normalizeTag(value) {
      return String(value ?? '').trim().replace(/\s+/g, ' ');
    }

    function normalizeSpecs(value) {
      if (!value || typeof value !== 'object') return {};
      const specs = {};
      Object.entries(value).forEach(([key, rawValue]) => {
        if (key === 'custom') return;
        const normalized = normalizeTag(rawValue);
        if (normalized) specs[key] = normalized;
      });
      specs.custom = Array.isArray(value.custom)
        ? value.custom.map((item) => ({ label:normalizeTag(item?.label), value:normalizeTag(item?.value) })).filter((item) => item.label && item.value)
        : [];
      return specs;
    }

    function esc(value) {
      return String(value ?? '').replace(/[&<>"']/g, (char) => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[char]));
    }

    function signed(value) {
      const number = toNumber(value);
      return number > 0 ? `+${number}` : String(number);
    }

    function formatTimestamp(timestamp) {
      if (!timestamp) return '時刻確定待ち';
      const date = timestamp.toDate ? timestamp.toDate() : new Date(timestamp);
      if (Number.isNaN(date.getTime())) return '時刻不明';
      return new Intl.DateTimeFormat('ja-JP', { year:'numeric', month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit' }).format(date);
    }

    function displayName() {
      return state.user?.displayName || 'Googleユーザー';
    }

    function getTagValues(key) {
      const tags = new Map();
      state.parts.map((part) => normalizeTag(part[key])).filter(Boolean).forEach((tag) => {
        const normalizedKey = tag.toLocaleLowerCase('ja');
        if (!tags.has(normalizedKey)) tags.set(normalizedKey, tag);
      });
      return [...tags.values()].sort((a, b) => a.localeCompare(b, 'ja'));
    }

    function renderTagOptions() {
      TAG_FIELDS.forEach(({ key, menuId }) => {
        const values = getTagValues(key);
        $(menuId).innerHTML = values.map((value) => `<button type="button" data-tag-option="${esc(value)}">${esc(value)}</button>`).join('')
          + '<div class="tag-empty">候補はありません。入力した値を新しいタグとして保存できます。</div>';
      });
      FILTER_FIELDS.forEach(({ key, selectId }) => {
        const select = $(selectId);
        const selected = select.value;
        select.innerHTML = '<option value="">すべて</option>' + getTagValues(key).map((value) => `<option value="${esc(value)}">${esc(value)}</option>`).join('');
        if (getTagValues(key).includes(selected)) select.value = selected;
      });
    }

    function toggleTagMenu(field, open) {
      const menu = $(field.menuId);
      if (open) {
        const query = normalizeTag($(field.inputId).value).toLocaleLowerCase('ja');
        const options = [...menu.querySelectorAll('[data-tag-option]')];
        let visible = 0;
        options.forEach((option) => {
          const matches = !query || option.dataset.tagOption.toLocaleLowerCase('ja').includes(query);
          option.classList.toggle('hidden', !matches);
          if (matches) visible += 1;
        });
        const empty = menu.querySelector('.tag-empty');
        if (empty) empty.classList.toggle('hidden', visible > 0);
        menu.classList.remove('hidden');
      } else {
        menu.classList.add('hidden');
      }
    }

    function closeTagMenus(exceptMenuId = '') {
      TAG_FIELDS.forEach(({ menuId }) => {
        if (menuId !== exceptMenuId) $(menuId).classList.add('hidden');
      });
    }

    function canonicalTag(key, value) {
      const normalized = normalizeTag(value);
      if (!normalized) return '';
      const existing = getTagValues(key).find((tag) => tag.toLocaleLowerCase('ja') === normalized.toLocaleLowerCase('ja'));
      return existing || normalized;
    }

    function getGenreSpecFields(genre) {
      const normalized = normalizeTag(genre);
      return GENRE_SPEC_FIELDS[normalized] || [];
    }

    function renderGenreDetails(specs = {}) {
      const genre = normalizeTag($('category').value);
      const fields = getGenreSpecFields(genre);
      if (!genre) {
        $('genreDetails').innerHTML = '';
        return;
      }
      const fieldMarkup = fields.map((field) => `<div><label for="spec_${field.key}">${field.label}</label><input id="spec_${field.key}" data-spec-key="${field.key}" value="${esc(specs[field.key] || '')}" placeholder="${field.placeholder}"></div>`).join('');
      $('genreDetails').innerHTML = `
        <h3>${esc(genre)}の追加情報</h3>
        ${fieldMarkup ? `<div class="spec-grid">${fieldMarkup}</div>` : '<p class="muted">下の「その他の追加情報」から項目を追加できます。</p>'}
        <div class="custom-specs">
          <h4>その他の追加情報</h4>
          <div id="customSpecRows"></div>
          <button type="button" class="add-custom-spec" id="addCustomSpec">＋項目を追加</button>
        </div>`;
      (specs.custom || []).forEach((item) => appendCustomSpecRow(item.label, item.value));
    }

    function appendCustomSpecRow(label = '', value = '') {
      const row = document.createElement('div');
      row.className = 'custom-spec-row';
      row.innerHTML = `<input data-custom-label placeholder="項目名" value="${esc(label)}"><input data-custom-value placeholder="値" value="${esc(value)}"><button type="button" class="secondary remove-custom-spec" aria-label="項目を削除">削除</button>`;
      $('customSpecRows').appendChild(row);
    }

    function collectSpecs() {
      const specs = {};
      document.querySelectorAll('#genreDetails [data-spec-key]').forEach((input) => {
        const value = normalizeTag(input.value);
        if (value) specs[input.dataset.specKey] = value;
      });
      const custom = [];
      document.querySelectorAll('#genreDetails .custom-spec-row').forEach((row) => {
        const label = normalizeTag(row.querySelector('[data-custom-label]')?.value);
        const value = normalizeTag(row.querySelector('[data-custom-value]')?.value);
        if (label && value) custom.push({ label, value });
      });
      if (custom.length) specs.custom = custom;
      return specs;
    }

    function specEntries(part) {
      const entries = getGenreSpecFields(part.category)
        .filter((field) => part.specs?.[field.key])
        .map((field) => ({ label:field.label, value:part.specs[field.key] }));
      (part.specs?.custom || []).forEach((item) => entries.push(item));
      return entries;
    }

    function specSummary(part) {
      const entries = specEntries(part);
      return entries.length ? entries.map((item) => `${esc(item.label)}: ${esc(item.value)}`).join('<br>') : '<span class="muted">—</span>';
    }

    function normalizePart(snapshot) {
      const data = snapshot.data();
      return {
        part_id:snapshot.id,
        name:String(data.name || ''),
        category:String(data.category || ''),
        manufacturer:String(data.manufacturer || ''),
        location:String(data.location || ''),
        stock:toNumber(data.stock),
        min_stock:toNumber(data.min_stock),
        unit:String(data.unit || '個'),
        note:String(data.note || ''),
        specs:normalizeSpecs(data.specs),
        lastObservedStock:data.lastObservedStock == null ? null : toNumber(data.lastObservedStock),
        lastObservedAt:data.lastObservedAt || null,
        lastObservedBy:String(data.lastObservedBy || ''),
        lastObservedDelta:data.lastObservedDelta == null ? null : toNumber(data.lastObservedDelta)
      };
    }

    function operationLabel(type) {
      return ({ ADD:'追加', USE:'使用', OBSERVE:'観測' })[type] || type;
    }

    async function loadParts() {
      const snapshot = await getDocs(collection(state.db, 'parts'));
      state.parts = snapshot.docs.map(normalizePart).sort((a, b) => a.name.localeCompare(b.name, 'ja'));
      renderTagOptions();
      render();
    }

    function reloadWithoutCache() {
      const url = new URL(window.location.href);
      url.searchParams.set('_reload', String(Date.now()));
      window.location.replace(url.toString());
    }

    function render() {
      const queryText = $('search').value.trim().toLowerCase();
      const filters = Object.fromEntries(FILTER_FIELDS.map(({ key, selectId }) => [key, $(selectId).value]));
      const visible = state.parts.filter((part) => {
        const searchable = [part.name, part.category, part.location, part.manufacturer, part.note, ...specEntries(part).flatMap((item) => [item.label, item.value])].join(' ').toLowerCase();
        return searchable.includes(queryText)
          && FILTER_FIELDS.every(({ key }) => !filters[key] || canonicalTag(key, part[key]) === filters[key]);
      });
      const lowCount = state.parts.filter((part) => part.stock <= part.min_stock).length;
      $('partCount').textContent = state.parts.length;
      $('lowStockCount').textContent = lowCount;
      $('partsBody').innerHTML = visible.length ? visible.map((part) => {
        const low = part.stock <= part.min_stock;
        return `<tr class="${low ? 'low' : ''}">
          <td data-label="部品名"><strong>${esc(part.name)}</strong><div class="muted">${esc(part.manufacturer)}</div></td>
          <td data-label="ジャンル">${esc(part.category)}</td><td data-label="保管場所">${esc(part.location)}</td>
          <td data-label="推定在庫"><strong>${part.stock}</strong> ${esc(part.unit)}</td>
          <td data-label="仕様" class="spec-summary">${specSummary(part)}</td>
          <td data-label="操作"><div class="actions">
            <button class="small add" data-action="ADD" data-id="${esc(part.part_id)}">追加</button>
            <button class="small use" data-action="USE" data-id="${esc(part.part_id)}">使用</button>
            <button class="small observe" data-action="OBSERVE" data-id="${esc(part.part_id)}">観測</button>
            <button class="small history" data-action="HISTORY" data-id="${esc(part.part_id)}">履歴</button>
            <button class="small history" data-action="EDIT" data-id="${esc(part.part_id)}">編集</button>
          </div></td>
        </tr>`;
      }).join('') : '<tr><td colspan="6">該当する部品がありません。</td></tr>';
    }

    function resetPartForm() {
      $('partForm').reset();
      state.editingId = '';
      $('unit').value = '個';
      $('minStock').value = '0';
      $('partFormTitle').textContent = '部品を登録';
      $('partFormHint').textContent = '新しい部品は在庫0で登録されます。';
      $('partSubmit').textContent = '部品を追加';
      $('deleteEditingPart').classList.add('hidden');
      renderGenreDetails({});
    }

    function closePartDialog() {
      if ($('partDialog').open) $('partDialog').close();
      resetPartForm();
    }

    function addPart() {
      resetPartForm();
      $('partDialog').showModal();
      setTimeout(() => $('name').focus(), 0);
    }

    function editPart(id) {
      const part = state.parts.find((item) => item.part_id === id);
      if (!part) return;
      state.editingId = id;
      $('name').value = part.name;
      $('category').value = part.category;
      $('manufacturer').value = part.manufacturer;
      $('location').value = part.location;
      $('unit').value = part.unit;
      $('minStock').value = part.min_stock;
      $('note').value = part.note;
      renderGenreDetails(part.specs);
      $('partFormTitle').textContent = '基本情報を編集';
      $('partFormHint').textContent = '部品情報を更新できます。';
      $('partSubmit').textContent = '基本情報を更新';
      $('deleteEditingPart').classList.remove('hidden');
      $('partDialog').showModal();
      setTimeout(() => $('name').focus(), 0);
    }

    async function savePart(event) {
      event.preventDefault();
      const name = $('name').value.trim();
      if (!name) return;
      const payload = { name, category:canonicalTag('category', $('category').value), manufacturer:canonicalTag('manufacturer', $('manufacturer').value), location:canonicalTag('location', $('location').value), unit:$('unit').value.trim() || '個', min_stock:Math.max(0, toNumber($('minStock').value)), note:$('note').value.trim(), specs:collectSpecs(), updatedAt:serverTimestamp(), updatedBy:displayName() };
      try {
        showMessage('保存中...');
        if (state.editingId) await setDoc(doc(state.db, 'parts', state.editingId), payload, { merge:true });
        else await addDoc(collection(state.db, 'parts'), { ...payload, stock:0, createdAt:serverTimestamp(), createdBy:displayName() });
        const wasEditing = Boolean(state.editingId);
        resetPartForm();
        $('partDialog').close();
        await loadParts();
        showMessage(wasEditing ? '基本情報を更新しました。' : '部品を追加しました。');
      } catch (error) { showMessage(error.message || '保存に失敗しました。', true); }
    }

    function openOperation(id, type) {
      const part = state.parts.find((item) => item.part_id === id);
      if (!part) return;
      state.operation = { id, type };
      $('operationTitle').textContent = operationLabel(type);
      $('operationPartName').textContent = `${part.name} / 現在の推定在庫: ${part.stock} ${part.unit}`;
      $('operationAmountLabel').textContent = type === 'OBSERVE' ? '実際に数えた個数' : '数量';
      $('operationAmount').min = type === 'OBSERVE' ? '0' : '1';
      $('operationAmount').value = type === 'OBSERVE' ? String(part.stock) : '';
      $('operationHint').textContent = type === 'OBSERVE' ? '観測前の推定在庫との差をズレとして記録します。' : `${type === 'ADD' ? '+' : '-'}方向で推定在庫を更新します。`;
      $('operationNote').value = '';
      $('operationDialog').showModal();
      setTimeout(() => $('operationAmount').focus(), 0);
    }

    async function recordOperation(event) {
      event.preventDefault();
      if (!state.operation) return;
      const { id, type } = state.operation;
      const amount = toNumber($('operationAmount').value);
      if ((type === 'OBSERVE' && amount < 0) || (type !== 'OBSERVE' && amount < 1)) return;
      try {
        showMessage('記録中...');
        const partRef = doc(state.db, 'parts', id);
        await runTransaction(state.db, async (transaction) => {
          const partSnapshot = await transaction.get(partRef);
          if (!partSnapshot.exists()) throw new Error('部品が見つかりません。');
          const part = partSnapshot.data();
          const beforeStock = toNumber(part.stock);
          const delta = type === 'ADD' ? amount : type === 'USE' ? -amount : amount - beforeStock;
          const stockAfter = type === 'OBSERVE' ? amount : beforeStock + delta;
          if (stockAfter < 0) throw new Error('在庫がマイナスになるため保存できません。');
          const partUpdate = { stock:stockAfter, updatedAt:serverTimestamp(), updatedBy:displayName() };
          if (type === 'OBSERVE') Object.assign(partUpdate, { lastObservedStock:amount, lastObservedAt:serverTimestamp(), lastObservedBy:displayName(), lastObservedDelta:delta });
          transaction.update(partRef, partUpdate);
          const historyRef = doc(collection(state.db, 'transactions'));
          transaction.set(historyRef, { partId:id, type, delta, quantity:type === 'OBSERVE' ? null : amount, observedStock:type === 'OBSERVE' ? amount : null, beforeStock, stockAfter, note:$('operationNote').value.trim(), operatorName:displayName(), operatorUid:state.user.uid, createdAt:serverTimestamp() });
        });
        $('operationDialog').close();
        state.operation = null;
        await loadParts();
        showMessage(`${operationLabel(type)}を記録しました。`);
      } catch (error) { showMessage(error.message || '記録に失敗しました。', true); }
    }

    async function deletePart(id) {
      const part = state.parts.find((item) => item.part_id === id);
      if (!part) return;
      if (!window.confirm(`「${part.name}」を削除しますか？\nこの部品の変更履歴も削除されます。`)) return;
      try {
        showMessage('削除中...');
        const historySnapshot = await getDocs(query(collection(state.db, 'transactions'), where('partId', '==', id)));
        const refs = [doc(state.db, 'parts', id), ...historySnapshot.docs.map((item) => item.ref)];
        for (let start = 0; start < refs.length; start += 450) {
          const batch = writeBatch(state.db);
          refs.slice(start, start + 450).forEach((ref) => batch.delete(ref));
          await batch.commit();
        }
        if (state.editingId === id) closePartDialog();
        await loadParts();
        showMessage('部品と変更履歴を削除しました。');
      } catch (error) { showMessage(error.message || '削除に失敗しました。', true); }
    }

    function normalizeHistory(snapshot) {
      const data = snapshot.data();
      const type = data.type || 'UNKNOWN';
      const quantity = data.quantity == null ? null : toNumber(data.quantity);
      const beforeStock = data.beforeStock == null ? null : toNumber(data.beforeStock);
      const stockAfter = data.stockAfter == null ? null : toNumber(data.stockAfter);
      const fallbackDelta = type === 'IN' ? quantity : type === 'OUT' ? -quantity : stockAfter != null && beforeStock != null ? stockAfter - beforeStock : 0;
      return { type:type === 'IN' ? 'ADD' : type === 'OUT' ? 'USE' : type, delta:data.delta == null ? fallbackDelta : toNumber(data.delta), quantity, observedStock:data.observedStock == null ? null : toNumber(data.observedStock), beforeStock, stockAfter, note:String(data.note || ''), operatorName:String(data.operatorName || data.operator || '不明'), createdAt:data.createdAt || data.timestamp || null };
    }

    async function openHistory(id) {
      const part = state.parts.find((item) => item.part_id === id);
      if (!part) return;
      $('historyTitle').textContent = `${part.name} の変更履歴`;
      $('historyList').innerHTML = '<p class="muted">読み込み中...</p>';
      $('historyDialog').showModal();
      try {
        const snapshot = await getDocs(query(collection(state.db, 'transactions'), where('partId', '==', id)));
        const histories = snapshot.docs.map(normalizeHistory).sort((a, b) => {
          const aTime = a.createdAt?.toMillis ? a.createdAt.toMillis() : 0;
          const bTime = b.createdAt?.toMillis ? b.createdAt.toMillis() : 0;
          return bTime - aTime;
        });
        $('historyList').innerHTML = histories.length ? histories.map((item) => {
          const deltaClass = item.delta > 0 ? 'delta-positive' : item.delta < 0 ? 'delta-negative' : '';
          const detail = item.type === 'OBSERVE'
            ? `実測 ${item.observedStock} / 観測前の推定 ${item.beforeStock} / ズレ ${signed(item.delta)}`
            : `変更量 <strong class="${deltaClass}">${signed(item.delta)}</strong>`;
          return `<div class="history-item"><div class="history-top"><span>${esc(operationLabel(item.type))}</span><span class="${deltaClass}">${item.stockAfter == null ? '' : `推定在庫 ${item.stockAfter}`}</span></div><div class="history-meta">${esc(formatTimestamp(item.createdAt))} / ${esc(item.operatorName)}<br>${detail}${item.note ? `<br>メモ: ${esc(item.note)}` : ''}</div></div>`;
        }).join('') : '<p class="muted">まだ変更履歴がありません。</p>';
      } catch (error) { $('historyList').innerHTML = `<p class="delta-negative">${esc(error.message || '履歴を読み込めませんでした。')}</p>`; }
    }

    async function startLogin() {
      try { await signInWithPopup(state.auth, new GoogleAuthProvider()); }
      catch (error) {
        const message = error.code === 'auth/popup-blocked' ? 'ポップアップがブロックされました。ブラウザでポップアップを許可してください。' : error.code === 'auth/popup-closed-by-user' ? 'ログイン画面が閉じられました。もう一度お試しください。' : error.message || 'Googleログインに失敗しました。';
        showStatus('ログインできませんでした', message, true);
      }
    }

    function showApp(user) {
      state.user = user;
      $('userName').textContent = displayName();
      $('userBar').classList.remove('hidden');
      $('statusScreen').classList.add('hidden');
      $('appScreen').classList.remove('hidden');
      loadParts().catch((error) => showMessage(error.message || 'データを読み込めませんでした。', true));
    }

    async function boot() {
      if (!isFirebaseConfigured) { showStatus('Firebase設定が必要です', 'docs/firebase-config.jsにFirebaseのWebアプリ設定を貼り付けてください。', false); return; }
      state.app = initializeApp(firebaseConfig);
      state.auth = getAuth(state.app);
      state.db = getFirestore(state.app);
      onAuthStateChanged(state.auth, (user) => user ? showApp(user) : showStatus('ログインしてください', 'Googleアカウントでログインすると在庫管理を使えます。', true));
    }

    $('loginButton').addEventListener('click', startLogin);
    $('logoutButton').addEventListener('click', () => signOut(state.auth));
    $('addPartButton').addEventListener('click', addPart);
    $('partForm').addEventListener('submit', savePart);
    $('deleteEditingPart').addEventListener('click', () => {
      if (state.editingId) deletePart(state.editingId);
    });
    $('partDialogClose').addEventListener('click', closePartDialog);
    $('category').addEventListener('change', () => renderGenreDetails(collectSpecs()));
    $('partForm').addEventListener('focusin', (event) => {
      const field = TAG_FIELDS.find((item) => item.inputId === event.target.id);
      if (!field) return;
      closeTagMenus(field.menuId);
      toggleTagMenu(field, true);
    });
    $('partForm').addEventListener('input', (event) => {
      const field = TAG_FIELDS.find((item) => item.inputId === event.target.id);
      if (field) toggleTagMenu(field, true);
    });
    $('partForm').addEventListener('click', (event) => {
      const toggle = event.target.closest('[data-tag-toggle]');
      if (toggle) {
        const field = TAG_FIELDS.find((item) => item.key === toggle.dataset.tagToggle);
        if (!field) return;
        const menu = $(field.menuId);
        closeTagMenus(field.menuId);
        toggleTagMenu(field, menu.classList.contains('hidden'));
        return;
      }
      const option = event.target.closest('[data-tag-option]');
      if (!option) return;
      const combo = option.closest('[data-tag-field]');
      const field = TAG_FIELDS.find((item) => item.key === combo?.dataset.tagField);
      if (!field) return;
      $(field.inputId).value = option.dataset.tagOption;
      if (field.key === 'category') renderGenreDetails(collectSpecs());
      toggleTagMenu(field, false);
    });
    $('genreDetails').addEventListener('click', (event) => {
      if (event.target.id === 'addCustomSpec') appendCustomSpecRow();
      if (event.target.classList.contains('remove-custom-spec')) event.target.closest('.custom-spec-row').remove();
    });
    $('operationForm').addEventListener('submit', recordOperation);
    $('operationCancel').addEventListener('click', () => $('operationDialog').close());
    $('historyClose').addEventListener('click', () => $('historyDialog').close());
    $('partsBody').addEventListener('click', (event) => {
      const button = event.target.closest('button[data-action]');
      if (!button) return;
      const action = button.dataset.action;
      if (action === 'EDIT') editPart(button.dataset.id);
      else if (action === 'HISTORY') openHistory(button.dataset.id);
      else openOperation(button.dataset.id, action);
    });
    $('cancelEdit').addEventListener('click', closePartDialog);
    $('partDialog').addEventListener('close', resetPartForm);
    $('reload').addEventListener('click', () => loadParts().catch((error) => showMessage(error.message || '再読込に失敗しました。', true)));
    $('hardReload').addEventListener('click', reloadWithoutCache);
    $('search').addEventListener('input', render);
    FILTER_FIELDS.forEach(({ selectId }) => $(selectId).addEventListener('change', render));
    $('clearFilters').addEventListener('click', () => {
      $('search').value = '';
      FILTER_FIELDS.forEach(({ selectId }) => { $(selectId).value = ''; });
      render();
    });
    document.addEventListener('click', (event) => {
      if (!event.target.closest('.tag-combobox')) closeTagMenus();
    });
    boot().catch((error) => showStatus('起動できませんでした', error.message || 'Firebaseの設定を確認してください。'));
  </script>
</body>
</html>
